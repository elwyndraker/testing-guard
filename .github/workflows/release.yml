name: Release

# Push a version tag (git tag v0.3 && git push origin v0.3) to build the signed AAB for the
# Play Console. The AAB is kept as a workflow artifact (Actions → this run → Artifacts); no APK
# is published, because the app is distributed through Google Play only. Needs the upload key
# as repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# (see README, "Automatic releases").
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName \"$version\" in app/build.gradle.kts. Raise versionName and versionCode first, then tag that commit."
            exit 1
          fi

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed AAB
        run: ./gradlew testDebugUnitTest bundleRelease

      - name: Check the signature and name the file
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if ! jarsigner -verify "$aab" | grep -q "jar verified"; then
            echo "::error::The AAB isn't signed. Check the signing secrets."
            exit 1
          fi
          mkdir dist
          cp "$aab" "dist/PrivacyGuard-$GITHUB_REF_NAME.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyGuard-${{ github.ref_name }}
          path: dist/
          retention-days: 90

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties
